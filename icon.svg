<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.55" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6FFFA"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA4D"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#042F2E" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- Squircle background on the macOS icon grid (824pt tile, 100pt margin) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tileShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <g filter="url(#glyphShadow)">
    <!-- Bell: top knob, body and flared rim -->
    <circle cx="512" cy="262" r="34" fill="url(#bell)"/>
    <path d="M512 280
             C 392 280 328 372 328 482
             L 328 600
             L 268 682
             Q 256 704 282 704
             L 742 704
             Q 768 704 756 682
             L 696 600
             L 696 482
             C 696 372 632 280 512 280 Z" fill="url(#bell)"/>
    <!-- Clapper -->
    <path d="M452 736 A60 60 0 0 0 572 736 Z" fill="url(#bell)"/>
  </g>

  <!-- Prompt chevron and cursor on the bell body: "builds notifications" -->
  <path d="M420 440 L496 500 L420 560" fill="none" stroke="#0F766E" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="524" y="538" width="96" height="40" rx="20" fill="#0F766E"/>

  <!-- Notification badge -->
  <circle cx="712" cy="300" r="78" fill="#FFFFFF"/>
  <circle cx="712" cy="300" r="62" fill="url(#badge)"/>
</svg>
